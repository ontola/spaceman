name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test
        working-directory: rust
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: rust

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build macos --release
      # ditto keeps the bundle's symlinks and permissions, which a plain
      # artifact upload of the .app folder loses.
      - name: Zip app
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/SpaceMan.app SpaceMan-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SpaceMan-macOS
          path: SpaceMan-macOS.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build windows --release
      # The .exe needs the DLLs and data folder next to it.
      - name: Zip app
        shell: pwsh
        run: |
          Rename-Item build/windows/x64/runner/Release SpaceMan
          Compress-Archive -Path build/windows/x64/runner/SpaceMan -DestinationPath SpaceMan-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SpaceMan-Windows
          path: SpaceMan-Windows.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # arm64 only: every current phone, and emulators on Apple Silicon.
      # Building the Rust core for more ABIs would multiply the build time.
      - run: flutter build apk --release --target-platform android-arm64
      - run: mv build/app/outputs/flutter-apk/app-release.apk SpaceMan-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SpaceMan-Android
          path: SpaceMan-Android.apk

  publish:
    needs: [macos, windows, android]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # Pushes and pull requests into main share the "dev" release; a pull
      # request stacked on another branch gets its own, so they don't
      # overwrite each other's builds.
      - name: Publish development build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TAG: ${{ (github.event_name == 'push' || github.base_ref == 'main') && 'dev' || format('dev-pr-{0}', github.event.number) }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" SpaceMan-macOS.zip SpaceMan-Windows.zip SpaceMan-Android.apk --prerelease --target "$SHA" \
            --title "Development build" \
            --notes "Latest builds ($SHA). Unsigned. macOS: the first time, right-click SpaceMan.app and choose Open. Windows: unzip, run SpaceMan.exe, and if SmartScreen warns, choose More info, Run anyway. Android: open SpaceMan-Android.apk on your phone and allow installing from this source."
