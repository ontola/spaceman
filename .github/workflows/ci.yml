name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test
        working-directory: rust
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: rust

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build macos --release
      # ditto keeps the bundle's symlinks and permissions, which a plain
      # artifact upload of the .app folder loses.
      - name: Zip app
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/SpaceMan.app SpaceMan-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SpaceMan-macOS
          path: SpaceMan-macOS.zip
      - name: Publish development build
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev SpaceMan-macOS.zip --prerelease --target "$SHA" \
            --title "Development build" \
            --notes "Latest macOS build ($SHA). Unsigned: the first time, right-click SpaceMan.app and choose Open."
