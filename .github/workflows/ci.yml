name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test
        working-directory: rust
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: rust

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  macos:
    runs-on: macos-latest
    env:
      # Optional: with these the DMG is signed and notarized, without them it
      # only carries Flutter's ad-hoc signature. See "Releasing on macOS" in
      # the README.
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Import signing certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      # Builds the app, signs and notarizes it when the secrets are there,
      # and packs it into the drag-to-Applications installer window.
      - run: tool/make_dmg.sh
      - run: mv build/SpaceMan.dmg SpaceMan-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: SpaceMan-macOS
          path: SpaceMan-macOS.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build windows --release
      # The .exe needs the DLLs and data folder next to it.
      - name: Zip app
        shell: pwsh
        run: |
          Rename-Item build/windows/x64/runner/Release SpaceMan
          Compress-Archive -Path build/windows/x64/runner/SpaceMan -DestinationPath SpaceMan-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SpaceMan-Windows
          path: SpaceMan-Windows.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # arm64 only: every current phone, and emulators on Apple Silicon.
      # Building the Rust core for more ABIs would multiply the build time.
      - run: flutter build apk --release --target-platform android-arm64
      - run: mv build/app/outputs/flutter-apk/app-release.apk SpaceMan-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SpaceMan-Android
          path: SpaceMan-Android.apk

  publish:
    needs: [macos, windows, android]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # Pushes and pull requests into main share the "dev" release; a pull
      # request stacked on another branch gets its own, so they don't
      # overwrite each other's builds.
      - name: Publish development build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TAG: ${{ (github.event_name == 'push' || github.base_ref == 'main') && 'dev' || format('dev-pr-{0}', github.event.number) }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" SpaceMan-macOS.dmg SpaceMan-Windows.zip SpaceMan-Android.apk --prerelease --target "$SHA" \
            --title "Development build" \
            --notes "Latest builds ($SHA). macOS: open SpaceMan-macOS.dmg and drag SpaceMan onto Applications. If macOS says it cannot check the app for malware, open System Settings, Privacy & Security, and choose Open Anyway. Windows: unzip, run SpaceMan.exe, and if SmartScreen warns, choose More info, Run anyway. Android: open SpaceMan-Android.apk on your phone and allow installing from this source."
