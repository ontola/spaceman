name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test
        working-directory: rust
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: rust

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build macos --release
      # Signing and notarizing need the Developer ID certificate and an
      # Apple ID in the repository secrets; without them (forks, before they
      # are set up) the build stays unsigned.
      - name: Import signing certificate
        id: sign
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "No MACOS_CERT_P12 secret: building unsigned."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | grep 'Developer ID Application' | head -1 | awk '{print $2}')"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      - name: Sign app
        if: steps.sign.outputs.identity != ''
        env:
          IDENTITY: ${{ steps.sign.outputs.identity }}
        run: |
          app=build/macos/Build/Products/Release/SpaceMan.app
          # Inside out: the frameworks first, then the app around them.
          find "$app/Contents/Frameworks" -depth \( -name '*.framework' -o -name '*.dylib' \) -print0 |
            xargs -0 -I{} codesign --force --options runtime --timestamp --sign "$IDENTITY" {}
          codesign --force --options runtime --timestamp --sign "$IDENTITY" \
            --entitlements macos/Runner/Release.entitlements "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
      # A disk image with the app next to an Applications shortcut, so
      # installing is dragging one onto the other.
      - name: Build disk image
        run: |
          mkdir dmg
          ditto build/macos/Build/Products/Release/SpaceMan.app dmg/SpaceMan.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname SpaceMan -srcfolder dmg -fs HFS+ -format UDZO -ov SpaceMan-macOS.dmg
      # Apple checks the signed app for malware and vouches for it, so it
      # opens without a warning. The ticket is stapled to the disk image so
      # this also works offline.
      - name: Sign and notarize disk image
        if: steps.sign.outputs.identity != ''
        env:
          IDENTITY: ${{ steps.sign.outputs.identity }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          codesign --force --timestamp --sign "$IDENTITY" SpaceMan-macOS.dmg
          if [ -z "$APPLE_ID" ]; then
            echo "No APPLE_ID secret: signed, but not notarized."
            exit 0
          fi
          xcrun notarytool submit SpaceMan-macOS.dmg --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple SpaceMan-macOS.dmg
          spctl --assess --type open --context context:primary-signature --verbose SpaceMan-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: SpaceMan-macOS
          path: SpaceMan-macOS.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build windows --release
      # Inno Setup installer (per-user by default, no admin prompt) with a
      # Start menu entry and an uninstaller. The version comes from pubspec.
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          # Flutter apps need the Visual C++ runtime; ship it next to the
          # .exe so SpaceMan also starts on PCs that never installed it.
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" build\windows\x64\runner\Release\
          }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" windows\installer\spaceman.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item build\installer\SpaceMan-Windows-Setup.exe SpaceMan-Windows-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: SpaceMan-Windows
          path: SpaceMan-Windows-Setup.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # arm64 only: every current phone, and emulators on Apple Silicon.
      # Building the Rust core for more ABIs would multiply the build time.
      - run: flutter build apk --release --target-platform android-arm64
      - run: mv build/app/outputs/flutter-apk/app-release.apk SpaceMan-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SpaceMan-Android
          path: SpaceMan-Android.apk

  publish:
    needs: [macos, windows, android]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # A tag like v0.1.0 publishes a release, which becomes "latest" and is
      # what the download links in the README point at. Asset names stay the
      # same for every version so those links keep working.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" SpaceMan-macOS.dmg SpaceMan-Windows-Setup.exe SpaceMan-Android.apk \
            --title "SpaceMan $GITHUB_REF_NAME" --generate-notes --latest \
            --notes "macOS: open the .dmg and drag SpaceMan to Applications (if macOS says it cannot check the app, right-click it and choose Open). Windows (unsigned): run SpaceMan-Windows-Setup.exe, and if SmartScreen warns, choose More info, Run anyway. Android: open SpaceMan-Android.apk on your phone and allow installing from this source."
      # Pushes and pull requests into main share the "dev" release; a pull
      # request stacked on another branch gets its own, so they don't
      # overwrite each other's builds.
      - name: Publish development build
        if: "!startsWith(github.ref, 'refs/tags/')"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TAG: ${{ (github.event_name == 'push' || github.base_ref == 'main') && 'dev' || format('dev-pr-{0}', github.event.number) }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" SpaceMan-macOS.dmg SpaceMan-Windows-Setup.exe SpaceMan-Android.apk --prerelease --target "$SHA" \
            --title "Development build" \
            --notes "Latest builds ($SHA). macOS: open the .dmg and drag SpaceMan to Applications (if macOS says it cannot check the app, right-click it and choose Open). Windows (unsigned): run SpaceMan-Windows-Setup.exe, and if SmartScreen warns, choose More info, Run anyway. Android: open SpaceMan-Android.apk on your phone and allow installing from this source."
