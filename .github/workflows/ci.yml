name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test
        working-directory: rust
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: rust

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build macos --release
      # A disk image with the app next to a link to Applications, so
      # installing is dragging one onto the other.
      - name: Build disk image
        run: |
          mkdir dmg
          cp -R build/macos/Build/Products/Release/SpaceMan.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname SpaceMan -srcfolder dmg -fs HFS+ -format UDZO -ov SpaceMan-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: SpaceMan-macOS
          path: SpaceMan-macOS.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build windows --release
      # The .exe needs the DLLs and data folder next to it; the installer
      # puts them all in place and adds a Start menu entry and uninstaller.
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\build\windows\x64\runner\Release" windows\installer\spaceman.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: SpaceMan-Windows
          path: SpaceMan-Windows-Setup.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # arm64 only: every current phone, and emulators on Apple Silicon.
      # Building the Rust core for more ABIs would multiply the build time.
      - run: flutter build apk --release --target-platform android-arm64
      - run: mv build/app/outputs/flutter-apk/app-release.apk SpaceMan-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SpaceMan-Android
          path: SpaceMan-Android.apk

  publish:
    needs: [macos, windows, android]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # A tag like v0.1.0 publishes a release, which becomes "latest" and is
      # what the download links in the README point at. Asset names stay the
      # same for every version so those links keep working.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" SpaceMan-macOS.dmg SpaceMan-Windows-Setup.exe SpaceMan-Android.apk \
            --title "SpaceMan $GITHUB_REF_NAME" --generate-notes --latest \
            --notes "Unsigned builds. macOS: open the .dmg, drag SpaceMan to Applications, and the first time right-click it and choose Open. Windows: run SpaceMan-Windows-Setup.exe, and if SmartScreen warns, choose More info, Run anyway. Android: open SpaceMan-Android.apk on your phone and allow installing from this source."
      # Pushes and pull requests into main share the "dev" release; a pull
      # request stacked on another branch gets its own, so they don't
      # overwrite each other's builds.
      - name: Publish development build
        if: "!startsWith(github.ref, 'refs/tags/')"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TAG: ${{ (github.event_name == 'push' || github.base_ref == 'main') && 'dev' || format('dev-pr-{0}', github.event.number) }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" SpaceMan-macOS.dmg SpaceMan-Windows-Setup.exe SpaceMan-Android.apk --prerelease --target "$SHA" \
            --title "Development build" \
            --notes "Latest builds ($SHA). Unsigned. macOS: open the .dmg, drag SpaceMan to Applications, and the first time right-click it and choose Open. Windows: run SpaceMan-Windows-Setup.exe, and if SmartScreen warns, choose More info, Run anyway. Android: open SpaceMan-Android.apk on your phone and allow installing from this source."
